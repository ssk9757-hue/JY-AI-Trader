<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JY AI Trader</title>
  <style>
    body{margin:0;background:#0b0f14;color:#fff;font-family:system-ui,-apple-system,sans-serif}
    .wrap{max-width:720px;margin:auto;padding:24px 16px}
    .card{background:#151b23;border:1px solid #26303d;border-radius:18px;padding:18px;margin-top:16px}
    h1{margin:0 0 8px}.muted{color:#93a1b2}.price{font-size:34px;font-weight:800;margin:12px 0}
    button{width:100%;padding:14px;border:0;border-radius:12px;background:#28d17c;color:#052016;font-size:16px;font-weight:800}
    .ok{margin-top:12px;color:#5ef0a2}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>JY AI Trader</h1>
    <div class="muted">GitHub Pages V1</div>
    <div class="card">
      <div class="muted">KRW-BTC</div>
      <div id="price" class="price">불러오는 중...</div>
      <button onclick="loadPrice()">새로고침</button>
      <div id="status" class="ok"></div>
    </div>
  </div>

  <script>
    async function loadPrice(){
      const price = document.getElementById('price');
      const status = document.getElementById('status');
      try{
        status.textContent = '업비트 연결 중...';
        const r = await fetch('https://api.upbit.com/v1/ticker?markets=KRW-BTC');
        if(!r.ok) throw new Error('API 오류');
        const data = await r.json();
        price.textContent = new Intl.NumberFormat('ko-KR',{
          style:'currency',currency:'KRW',maximumFractionDigits:0
        }).format(data[0].trade_price);
        status.textContent = '업비트 실시간 연결 완료';
      }catch(e){
        price.textContent = '불러오기 실패';
        status.textContent = '잠시 후 다시 눌러주세요.';
      }
    }
    loadPrice();
  </script>
</body>
</html>
